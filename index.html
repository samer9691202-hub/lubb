<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102a43"><meta name="description" content="مِداد — مساحة هادئة لتنظيم يومك ومهامك وأفكارك">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon.svg"><link rel="stylesheet" href="css/app.css">
<title>مِداد | مساحة يومك</title>
</head>
<body>
<div class="app-shell">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="brand-mark"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M8 29V11l12 9 12-9v18M8 11l12 9 12-9"/></svg></div><div><b>مِداد</b><small>مساحة يومك</small></div></div>
  <div class="side-label">مساحتك</div>
  <nav class="nav" aria-label="التنقل الرئيسي">
    <button class="nav-item active" data-page="home"><span>⌂</span>الرئيسية</button>
    <button class="nav-item" data-page="planner"><span>▦</span>التخطيط</button>
    <button class="nav-item" data-page="tasks"><span>☷</span>المهام <i id="taskCount">0</i></button>
    <button class="nav-item" data-page="notes"><span>▤</span>الملاحظات</button>
    <button class="nav-item" data-page="library"><span>▣</span>السجل</button>
  </nav>
  <div class="sidebar-bottom"><div class="offline"><span></span> يعمل دون اتصال</div><button class="nav-item" data-page="settings"><span>⚙</span>الإعدادات</button><div class="side-foot">مِداد · الإصدار 1.0.0</div></div>
</aside>
<main class="main-area">
<header class="topbar"><button class="icon-btn mobile-menu" id="menuBtn" aria-label="القائمة">☰</button><div class="crumb"><span>مساحتك</span><b id="pageTitle">الرئيسية</b></div><div class="top-actions"><button class="icon-btn" id="quickAdd" title="إضافة مهمة">＋</button><div class="avatar">م</div></div></header>
<section class="content" id="content" aria-live="polite"></section>
</main>
</div>
<div class="toast" id="toast" role="status"></div>
<dialog id="editor" class="modal"><form method="dialog" id="editorForm"><div class="modal-head"><div><small id="editorKicker">إضافة</small><h2 id="editorTitle">عنصر جديد</h2></div><button class="icon-btn" value="cancel" aria-label="إغلاق">×</button></div><div id="editorFields"></div><div class="modal-actions"><button class="btn ghost" value="cancel">إلغاء</button><button class="btn primary" id="saveEditor" value="default">حفظ</button></div></form></dialog>
<dialog id="pinDialog" class="modal narrow"><form method="dialog" id="pinForm"><div class="modal-head"><div><small>حماية مِداد</small><h2 id="pinTitle">رمز الدخول</h2></div></div><p class="muted" id="pinHint">أدخل رمز PIN للمتابعة.</p><input class="field pin-input" id="pinInput" inputmode="numeric" maxlength="8" type="password" placeholder="••••" autocomplete="off"><div class="modal-actions"><button class="btn primary" id="pinSubmit" value="default">متابعة</button></div></form></dialog>
<script type="module" src="js/app.js"></script>
</body></html>

<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f7f9"><title>LUBB</title><link rel="stylesheet" href="styles.css"></head><body>
<div class="app"><aside class="sidebar" id="sidebar"><div class="brand"><b class="logo">l</b><span><strong>LUBB</strong><small>مساحة عملك</small></span><button id="closeNav" class="mobile">×</button></div><div class="space">◉　مساحتي الشخصية　⌄</div><label>مساحة العمل</label><nav><button class="active" data-page="today">◷　اليوم <i id="badge">0</i></button><button data-page="upcoming">▦　القادم</button><button data-page="inbox">↳　الوارد</button><button data-page="all">☷　كل المهام</button></nav><label>قوائمي</label><nav><button data-page="work">●　مشاريع العمل</button><button data-page="personal">●　شخصي</button><button data-page="ideas">●　أفكار لاحقاً</button></nav><label>أدواتك</label><nav><button data-page="calendar">▦　التقويم</button><button data-page="notes">▤　الملاحظات</button><button data-page="reminders">◉　التذكيرات</button><button data-page="archive">▱　الأرشيف</button></nav><div class="bottom"><div class="status">●　بيانات محفوظة على الجهاز</div><nav><button data-page="settings">⚙　الإعدادات</button></nav><div class="profile">م　 <span><b>مساحتي</b><small>الحساب الشخصي</small></span></div></div></aside><div id="scrim"></div>
<main><header><button id="menu" class="mobile">☰</button><span class="crumb">مساحتي الشخصية　/　<b id="crumb">اليوم</b></span><div><button id="search">⌕　بحث</button><button data-page="reminders">♧</button></div></header><section class="content"><div class="heading"><div><small id="date"></small><h1 id="title">اليوم</h1><p id="desc">رتّب أولوياتك وابدأ بما يهم.</p></div><button class="primary" id="add">＋ مهمة جديدة</button></div><div id="view"></div><footer>● بياناتك محفوظة محلياً على هذا الجهاز</footer></section></main></div>
<dialog id="taskDialog"><form id="taskForm" method="dialog"><h2>مهمة جديدة <button type="button" id="taskClose">×</button></h2><input id="taskTitle" required placeholder="ما الذي تريد إنجازه؟"><textarea id="taskDetails" placeholder="تفاصيل اختيارية"></textarea><div class="fields"><input id="taskDate" type="date"><select id="taskPriority"><option value="normal">عادية</option><option value="high">عالية</option><option value="low">منخفضة</option></select></div><select id="taskList"><option value="work">مشاريع العمل</option><option value="personal">شخصي</option><option value="ideas">أفكار لاحقاً</option><option value="inbox">الوارد</option></select><div class="actions"><button type="button" id="taskCancel">إلغاء</button><button class="primary">حفظ المهمة</button></div></form></dialog>
<dialog id="noteDialog"><form id="noteForm" method="dialog"><h2>ملاحظة <button type="button" id="noteClose">×</button></h2><input id="noteTitle" required placeholder="عنوان الملاحظة"><textarea id="noteBody" rows="7" placeholder="اكتب ملاحظتك هنا"></textarea><div class="actions"><button type="button" id="noteCancel">إلغاء</button><button class="primary">حفظ الملاحظة</button></div></form></dialog><div id="toast"></div><script src="app.js"></script></body></html>

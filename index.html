<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f6f8fb"><meta name="description" content="LUBB — مساحة هادئة لتنظيم يومك ومهامك وأفكارك.">
<link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css">
<title>LUBB — نظّم يومك</title>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="brand-mark">L</div><span>LUBB</span><button class="icon-btn mobile-close" id="closeSidebar" aria-label="إغلاق">×</button></div>
    <button class="workspace"><span class="avatar">ل</span><span class="workspace-copy"><b>مساحتي</b><small>مساحة العمل الشخصية</small></span><span class="chevron">⌄</span></button>
    <div class="side-label">مساحة العمل</div>
    <nav class="nav-list">
      <button class="nav-item active" data-view="today"><span class="nav-icon">◷</span><span>اليوم</span><em id="todayCount">0</em></button>
      <button class="nav-item" data-view="upcoming"><span class="nav-icon">▦</span><span>القادم</span><em id="upcomingCount">0</em></button>
      <button class="nav-item" data-view="all"><span class="nav-icon">☷</span><span>كل المهام</span><em id="allCount">0</em></button>
      <button class="nav-item" data-view="important"><span class="nav-icon">☆</span><span>المهمة</span><em id="importantCount">0</em></button>
    </nav>
    <div class="side-label side-label-row"><span>مساحتي</span><button class="tiny-add" id="newList" title="قائمة جديدة">＋</button></div>
    <nav class="nav-list" id="customLists"><button class="nav-item" data-view="notes"><span class="nav-icon">▤</span><span>الملاحظات</span></button><button class="nav-item" data-view="calendar"><span class="nav-icon">▦</span><span>التقويم</span></button></nav>
    <div class="sidebar-bottom">
      <button class="nav-item" data-view="archive"><span class="nav-icon">▣</span><span>الأرشيف</span></button>
      <button class="nav-item" data-view="settings"><span class="nav-icon">⚙</span><span>الإعدادات</span></button>
      <div class="side-foot"><span class="status-dot"></span> بياناتك محفوظة على هذا الجهاز</div>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="openSidebar" aria-label="القائمة">☰</button>
      <div class="breadcrumb"><span>مساحتي</span><b>/</b><strong id="crumb">اليوم</strong></div>
      <div class="top-actions"><button class="icon-btn" id="searchToggle" title="بحث">⌕</button><button class="icon-btn" id="themeToggle" title="تغيير المظهر">◐</button><button class="user-chip"><span class="avatar small">ل</span><span>حسابي</span></button></div>
    </header>
    <section class="content">
      <div class="search-wrap hidden" id="searchWrap"><input id="searchInput" placeholder="ابحث في المهام والملاحظات..." autocomplete="off"><button class="icon-btn" id="searchClose">×</button></div>
      <div id="viewRoot"></div>
    </section>
  </main>
</div>
<div class="toast" id="toast"></div>
<dialog id="taskDialog" class="modal">
 <form method="dialog" id="taskForm">
  <div class="modal-head"><div><span class="eyebrow">مهمة جديدة</span><h2>أضف إلى يومك</h2></div><button class="icon-btn" value="cancel">×</button></div>
  <label>عنوان المهمة<input id="taskTitle" required maxlength="120" placeholder="ما الذي تريد إنجازه؟"></label>
  <label>التاريخ<input id="taskDate" type="date"></label>
  <label>الأولوية<select id="taskPriority"><option value="normal">عادية</option><option value="high">مهمة</option><option value="low">منخفضة</option></select></label>
  <label>تفاصيل <textarea id="taskDetail" rows="3" placeholder="تفاصيل اختيارية..."></textarea></label>
  <div class="modal-actions"><button class="btn ghost" value="cancel">إلغاء</button><button class="btn primary" id="saveTask" value="default">حفظ المهمة</button></div>
 </form>
</dialog>
<dialog id="noteDialog" class="modal">
 <form method="dialog" id="noteForm">
  <div class="modal-head"><div><span class="eyebrow">مساحة الأفكار</span><h2>ملاحظة جديدة</h2></div><button class="icon-btn" value="cancel">×</button></div>
  <label>العنوان<input id="noteTitle" required maxlength="120" placeholder="عنوان الملاحظة"></label>
  <label>المحتوى<textarea id="noteBody" rows="7" placeholder="اكتب فكرتك هنا..."></textarea></label>
  <div class="modal-actions"><button class="btn ghost" value="cancel">إلغاء</button><button class="btn primary" id="saveNote" value="default">حفظ الملاحظة</button></div>
 </form>
</dialog>
<script src="app.js"></script>
</body></html>
